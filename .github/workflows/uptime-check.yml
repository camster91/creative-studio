name: Uptime check

on:
  schedule:
    # GitHub Actions is a coarse health check, not a primary uptime monitor.
    # Hourly cadence preserves signal while avoiding 144 hosted-runner jobs/day.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: creative-studio-uptime
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit /api/whoami
        env:
          URL: https://photogen.ashbi.ca
        run: |
          set -e
          code=$(curl -s --max-time 90 -o /tmp/whoami.json -w "%{http_code}" "$URL/api/whoami")
          if [ "$code" != "200" ]; then
            echo "FAIL: $URL/api/whoami returned HTTP $code"
            cat /tmp/whoami.json 2>/dev/null || true
            exit 1
          fi
          html=$(curl -sf --max-time 90 "$URL/app")
          for marker in "dropzone" "Generate" "scene"; do
            echo "$html" | grep -q "$marker" || (echo "FAIL: /app missing '$marker'"; exit 1)
          done
          echo "OK — both /api/whoami and /app rendered cleanly"
