name: Build and smoke PhotoGen image

# The Hostinger KVM 4 / Coolify VPS (vps.ashbi.ca) is shut down. SSH staging
# and production deploy jobs were removed. This workflow only builds the
# image, pushes it to GHCR, and smoke-tests it in CI.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: photogen-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  # ── Build the image in CI, push to GitHub Container Registry ──
  build:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      full_sha: ${{ steps.meta.outputs.full_sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        run: |
          SHA=$(git rev-parse --short HEAD)
          FULL_SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
          echo "full_sha=$FULL_SHA" >> $GITHUB_OUTPUT
          echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/camster91/creative-studio:${{ steps.meta.outputs.sha }}
            ghcr.io/camster91/creative-studio:${{ steps.meta.outputs.full_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag :latest on main only
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ghcr.io/camster91/creative-studio:latest

      - name: Image metadata
        run: |
          echo "### Image built" >> $GITHUB_STEP_SUMMARY
          echo "- SHA: \`${{ steps.meta.outputs.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Full SHA: \`${{ steps.meta.outputs.full_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Tags: ghcr.io/camster91/creative-studio:\`${{ steps.meta.outputs.sha }}\`, :\`${{ steps.meta.outputs.full_sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ── Test the freshly built image before deploying anywhere ──
  smoke:
    name: Smoke test the new image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Pull and run the image
        run: |
          # Login to ghcr for the private image
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker pull ghcr.io/camster91/creative-studio:${{ needs.build.outputs.full_sha }}
          docker run -d --name smoke -p 15173:5173 \
            -e CREATIVE_OUTPUT_DIR=/tmp/out -e CREATIVE_DATA_DIR=/tmp/data \
            -e CREATIVE_DAILY_LIMIT=0 \
            -e PORT=5173 \
            ghcr.io/camster91/creative-studio:${{ needs.build.outputs.full_sha }}
          # Allow it to come up
          for i in {1..30}; do
            if curl -sf http://localhost:15173/api/whoami > /dev/null; then
              echo "Container up after ${i}s"
              break
            fi
            sleep 1
          done
      - name: Health check
        run: |
          set -e
          STATUS=$(curl -s -o /tmp/whoami.json -w "%{http_code}" http://localhost:15173/api/whoami)
          if [ "$STATUS" != "200" ]; then
            echo "FAIL: /api/whoami returned $STATUS"
            docker logs smoke
            exit 1
          fi
          cat /tmp/whoami.json
          echo ""
          # Verify the app is up (version-agnostic — drifts every release)
          python3 -c "import json; d=json.load(open('/tmp/whoami.json')); assert 'version' in d, f'no version in whoami: {d}'; print('whoami OK, version=' + d['version'])"
      - name: Private state is closed to anonymous callers
        run: test "$(curl -s -o /tmp/costs.json -w '%{http_code}' http://localhost:15173/api/costs)" = "401"
      - name: Home page renders
        run: |
          set -e
          HTML=$(curl -sf http://localhost:15173/)
          echo "$HTML" | grep -q "Photogen Campaign Factory" || (echo "FAIL: home page missing Campaign Factory positioning"; exit 1)
          # No literal \u003e in served HTML (regression guard for the
          # raw-string arrow bug we hit before)
          echo "$HTML" | grep -q "u003e" && (echo "FAIL: served HTML contains literal \\\\u003e (raw-string arrow bug regression)"; exit 1) || echo "No literal \u003e — OK"
          echo "Home page OK"
      - name: Editor renders
        run: |
          set -e
          HTML=$(curl -sf http://localhost:15173/app)
          # Must contain the 3 core editor surfaces
          for marker in "dropzone" "Generate" "Scene" "In-hand" "Studio" "Lifestyle"; do
            echo "$HTML" | grep -q "$marker" || (echo "FAIL: /app missing '$marker'"; exit 1)
          done
          echo "Editor OK — all 6 core markers present"
      - name: Campaign Factory renders
        run: |
          set -e
          HTML=$(curl -sf http://localhost:15173/campaigns)
          for marker in "Campaign Factory" "Brand Passport" "Product Truth" "READINESS GATE"; do
            echo "$HTML" | grep -q "$marker" || (echo "FAIL: /campaigns missing '$marker'"; exit 1)
          done
          echo "Campaign Factory OK"
      - name: Teardown
        if: always()
        run: |
          docker stop smoke 2>/dev/null || true
          docker rm smoke 2>/dev/null || true
          docker image prune -f || true
